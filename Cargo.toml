[package]
name = "todo-overlay"
version = "0.1.0"
edition = "2024"
description = "Overlay de to-do list leve e semitransparente para Windows"
publish = false

[dependencies]
# UI: backend glow (OpenGL) é mais leve que wgpu; sem features default.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "persistence",
] }
global-hotkey = "0.10"
tray-icon = { version = "0.26", default-features = false }
winreg = "0.56"
# Só para ler o HWND da janela do eframe; já vem na árvore via winit.
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
